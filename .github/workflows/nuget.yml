name: NuGet Publish

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for Source Link to embed full commit history
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Resolve package version from assembly
        id: package-version
        run: |
          package_version=$(dotnet msbuild AspNetCore.Identity.CosmosDb/AspNetCore.Identity.CosmosDb.csproj -nologo -getProperty:AssemblyVersion | awk 'NF { value = $0 } END { print value }' | tr -d '\r')
          if [[ -z "$package_version" ]]; then
            echo "AssemblyVersion was not found for AspNetCore.Identity.CosmosDb.csproj"
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release -p:GeneratePackageOnBuild=false
      - name: Prepare package output folder
        run: rm -rf ./nupkg && mkdir -p ./nupkg
      - name: Pack main library
        run: dotnet pack AspNetCore.Identity.CosmosDb/AspNetCore.Identity.CosmosDb.csproj -c Release --no-build --no-restore -p:PackageVersion=${{ steps.package-version.outputs.package_version }} -o ./nupkg
      - name: Pack templates
        run: dotnet pack AspNetCore.Identity.Razor.PassKeyPage/AspNetCore.Identity.Razor.PassKeyPage.csproj -c Release --no-build --no-restore -p:PackageVersion=${{ steps.package-version.outputs.package_version }} -o ./nupkg
      - name: Pack demo project template
        run: dotnet pack AspNetCore.Identity.CosmosDb.Demo.Template/AspNetCore.Identity.CosmosDb.Demo.Template.csproj -c Release --no-build --no-restore -p:PackageVersion=${{ steps.package-version.outputs.package_version }} -o ./nupkg
      - name: Publish main library package
        run: dotnet nuget push "${{ github.workspace }}/nupkg/AspNetCore.Identity.CosmosDb.${{ steps.package-version.outputs.package_version }}.nupkg" --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish passkey template package
        run: dotnet nuget push "${{ github.workspace }}/nupkg/AspNetCore.Identity.Razor.PassKeyPage.${{ steps.package-version.outputs.package_version }}.nupkg" --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish demo app template package
        run: dotnet nuget push "${{ github.workspace }}/nupkg/CWALabs.AspNetCore.Identity.CosmosDb.DemoTemplate.${{ steps.package-version.outputs.package_version }}.nupkg" --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Publish NuGet symbols
        run: dotnet nuget push "${{ github.workspace }}/nupkg/AspNetCore.Identity.CosmosDb.${{ steps.package-version.outputs.package_version }}.snupkg" --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            nupkg/*.nupkg
            nupkg/*.snupkg